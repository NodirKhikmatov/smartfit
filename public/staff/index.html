<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5a46">
<title>Smart Fit</title>
<link rel="manifest" href="/staff/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/shared/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/shared/apple-touch-icon.png">
<link rel="preload" href="/shared/fonts/onest-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/shared/ui.css">
<link rel="stylesheet" href="/staff/staff.css">
<script type="module" src="/staff/staff.js"></script>
</head>
<body class="ui-compact">
<form id="login" class="card raised" hidden>
  <div class="wordmark"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#logo"></use></svg>Smart Fit</div>
  <h1 data-i18n="staff.login.title"></h1>
  <div id="loginLang"></div>
  <label><span data-i18n="adm.login.email"></span> <input name="email" type="email" autocomplete="username" required></label>
  <label><span data-i18n="adm.login.password"></span> <input name="password" type="password" autocomplete="current-password" required></label>
  <p class="error" id="loginError" role="alert"></p>
  <button class="primary" data-i18n="adm.login.submit"></button>
</form>

<div id="app" hidden>
  <header class="bar">
    <div class="wordmark"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#logo"></use></svg>Smart Fit</div>
    <div id="lang"></div>
    <button type="button" class="icon-btn ghost" id="logout" data-i18n-aria-label="adm.logout" data-i18n-title="adm.logout"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#logout"></use></svg></button>
  </header>
  <div class="tabs" role="group" data-i18n-aria-label="staff.sections" id="tabs">
    <button type="button" class="chip" data-tab="fitting"><span data-i18n="staff.tab.fitting"></span> <span class="count-pill" id="nFitting" hidden></span></button>
    <button type="button" class="chip" data-tab="pay"><span data-i18n="staff.tab.pay"></span> <span class="count-pill" id="nPay" hidden></span></button>
    <button type="button" class="chip" data-tab="orders"><span data-i18n="staff.tab.orders"></span> <span class="count-pill" id="nOrders" hidden></span></button>
    <button type="button" class="chip" data-tab="low"><span data-i18n="staff.tab.low"></span> <span class="count-pill" id="nLow" hidden></span></button>
    <button type="button" class="chip" data-tab="sales"><span data-i18n="staff.tab.sales"></span></button>
  </div>
  <main id="main">
    <p class="notice" id="sound"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#info"></use></svg><span><span data-i18n="staff.sound_text"></span> <button type="button" id="soundOn" data-i18n="staff.sound_on"></button></span></p>
    <p class="notice danger" id="offline" role="alert" hidden><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#alert"></use></svg><span data-i18n="adm.offline"></span></p>
    <div id="kiosks" role="status"></div>
    <section id="fitting" data-section>
      <h2 class="visually-hidden" data-i18n="staff.tab.fitting"></h2>
      <div class="list" id="fitList"></div>
      <section class="card stats" id="stats" aria-labelledby="statsTitle"><h3 id="statsTitle" data-i18n="staff.stats.title"></h3><div id="statsBody"></div></section>
    </section>
    <!-- Task 51: orders waiting at the till; staff say how the customer paid -->
    <section id="pay" data-section hidden>
      <h2 class="visually-hidden" data-i18n="staff.tab.pay"></h2>
      <div class="list" id="payList"></div>
    </section>
    <section id="orders" data-section hidden>
      <h2 class="visually-hidden" data-i18n="staff.tab.orders"></h2>
      <div class="list" id="orderList"></div>
    </section>
    <section id="low" data-section hidden>
      <h2 class="visually-hidden" data-i18n="staff.tab.low"></h2>
      <p class="notice" id="queueNote" role="status" hidden><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#clock"></use></svg><span></span></p>
      <div class="list" id="rejectedList"></div>
      <div id="stockHome">
        <div class="actions stock-start">
          <button type="button" class="primary" id="newReceive"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#plus"></use></svg><span data-i18n="staff.stock.receive"></span></button>
          <button type="button" id="newCount"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#check"></use></svg><span data-i18n="staff.stock.count"></span></button>
        </div>
        <div id="incomingWrap" hidden>
          <h3 class="stock-low-title" data-i18n="staff.tr.incoming"></h3>
          <div class="list" id="incomingList"></div>
        </div>
        <div class="list" id="sessionList"></div>
        <h3 class="stock-low-title" data-i18n="staff.stock.low_title"></h3>
        <div id="lowList"></div>
      </div>
      <form id="sessionForm" class="card stock-card" hidden novalidate>
        <h3 id="sfTitle"></h3>
        <p class="muted" id="sfText"></p>
        <label class="field" id="sfStoreWrap"><span data-i18n="common.store"></span> <select name="store"></select></label>
        <label class="field" data-count><span data-i18n="field.category"></span> <select name="category"></select></label>
        <label class="field" data-count><span data-i18n="field.shelf_location"></span> <input name="shelf" maxlength="40" autocomplete="off" spellcheck="false"></label>
        <label class="field"><span data-i18n="field.stock_note"></span> <input name="note" maxlength="200" autocomplete="off" aria-describedby="sfNoteHint"></label>
        <p class="hint" id="sfNoteHint"></p>
        <p class="error" id="sfError" role="alert"></p>
        <div class="actions">
          <button type="button" id="sfCancel" data-i18n="common.cancel"></button>
          <button class="primary" data-i18n="staff.stock.start"></button>
        </div>
      </form>
      <div id="stockSession" hidden>
        <div class="stock-head">
          <button type="button" class="icon-btn ghost" id="ssBack" data-i18n-aria-label="staff.stock.back" data-i18n-title="staff.stock.back"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#arrow-left"></use></svg></button>
          <div class="grow"><h3 id="ssTitle"></h3><p class="muted" id="ssSub"></p></div>
        </div>
        <form id="scanForm" class="card stock-card" novalidate>
          <div class="stock-code">
            <label class="field grow"><span data-i18n="staff.stock.code"></span> <input name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="search" aria-describedby="codeHint"></label>
            <button type="button" class="icon-btn" id="camBtn" data-i18n-aria-label="staff.stock.camera" data-i18n-title="staff.stock.camera" hidden><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#camera"></use></svg></button>
            <button id="findBtn" data-i18n="staff.stock.find"></button>
          </div>
          <p class="hint" id="codeHint"></p>
          <video id="camView" playsinline muted hidden></video>
          <p class="error" id="scanError" role="alert"></p>
          <div class="list" id="scanMatches"></div>
          <div id="scanPick" hidden>
            <p class="stock-pick-name" id="pickName"></p>
            <div class="chips" id="pickSizes" role="group" data-i18n-aria-label="staff.stock.size"></div>
            <label class="field"><span data-i18n="field.quantity"></span> <input name="qty" type="number" step="1" inputmode="numeric" aria-describedby="qtyHint"></label>
            <p class="hint" id="qtyHint"></p>
            <div id="costWrap" hidden>
              <label class="field"><span data-i18n="staff.stock.cost"></span> <input name="cost" type="number" min="0" step="1" inputmode="numeric" aria-describedby="costHint"></label>
              <p class="hint" id="costHint" data-i18n="staff.stock.cost_hint"></p>
            </div>
            <button type="button" class="primary" id="scanAdd" data-i18n="staff.stock.add"></button>
          </div>
        </form>
        <div id="ssBody"></div>
        <div class="actions" id="ssActions"></div>
      </div>
    </section>
    <!-- Task 50: "Mening sotuvlarim": the signed-in member's own sales and commission, nobody else's -->
    <section id="sales" data-section hidden>
      <h2 data-i18n="staff.sales.title"></h2>
      <div class="chips" role="group" data-i18n-aria-label="staff.sales.period" id="salesPeriod"></div>
      <p class="error" id="salesError" role="alert"></p>
      <dl class="card sales" id="salesBody"></dl>
      <p class="hint" data-i18n="staff.sales.hint"></p>
    </section>
  </main>
</div>
</body>
</html>
