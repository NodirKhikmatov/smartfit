<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Fit</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/shared/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/shared/apple-touch-icon.png">
<link rel="preload" href="/shared/fonts/onest-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/shared/ui.css">
<link rel="stylesheet" href="/app/app.css">
</head>
<body>
<header class="topbar">
  <button id="back" class="icon-btn ghost" hidden data-i18n-aria-label="common.back" data-i18n-title="common.back"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#arrow-left"></use></svg></button>
  <button id="mallBtn" class="ghost mall-btn" hidden data-i18n-aria-label="kiosk.mall.back" data-i18n-title="kiosk.mall.back"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#store"></use></svg><span data-i18n="kiosk.mall.back"></span></button>
  <div class="wordmark"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#logo"></use></svg><span id="storeName">Smart Fit</span></div>
  <div id="langBox"></div>
  <button id="cartBtn" hidden aria-live="polite"></button>
  <button id="home" class="icon-btn ghost" hidden data-i18n-aria-label="kiosk.home" data-i18n-title="kiosk.home"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#home"></use></svg></button>
</header>
<main>
  <ol class="steps" id="steps" hidden data-i18n-aria-label="kiosk.steps">
    <li data-step="form" data-i18n="kiosk.step.form"></li>
    <li data-step="camera" data-i18n="kiosk.step.camera"></li>
    <li data-step="results" data-i18n="kiosk.step.results"></li>
    <li data-step="cart" data-i18n="kiosk.step.cart"></li>
  </ol>

  <section data-screen="start" class="attract">
    <div class="attract-copy">
      <h1 tabindex="-1" data-i18n="kiosk.start.title"></h1>
      <div class="weather card loading" id="weather" aria-live="polite" aria-busy="true"><span class="skeleton line short"></span><span class="skeleton block"></span><span class="visually-hidden" data-i18n="kiosk.weather.loading"></span></div>
      <p class="error" id="startError" role="alert"></p>
      <div id="storePicker" hidden></div>
      <button class="primary wide go" id="start"><span id="startLabel" data-i18n="kiosk.start.go"></span><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#arrow-right"></use></svg></button>
      <div class="start-more">
        <button class="secondary wide" id="catalogBtn" hidden><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#hanger"></use></svg><span data-i18n="kiosk.start.catalog"></span></button>
        <button class="secondary wide" id="profileLogin" hidden><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#user"></use></svg><span data-i18n="kiosk.profile.login"></span></button>
      </div>
    </div>
    <div class="lookbook" id="lookbook" aria-hidden="true"></div>
  </section>

  <section data-screen="form" hidden>
    <h1 tabindex="-1" data-i18n="kiosk.form.title"></h1>
    <form id="form" novalidate class="form-grid">
      <fieldset class="span want" aria-describedby="wantHint">
        <legend data-i18n="kiosk.want.title"></legend>
        <div class="chips want-chips" id="wantChips"></div>
        <p class="hint" id="wantHint" data-i18n="kiosk.want.hint"></p>
      </fieldset>
      <fieldset class="span occasion" aria-describedby="occasionHint">
        <legend data-i18n="kiosk.occasion.title"></legend>
        <div class="chips occasion-chips" id="occasionChips">
          <label><input type="radio" name="occasion" value="" checked><span data-i18n="kiosk.occasion.any"></span></label>
          <label><input type="radio" name="occasion" value="daily"><span data-i18n="kiosk.occasion.daily"></span></label>
          <label><input type="radio" name="occasion" value="work"><span data-i18n="kiosk.occasion.work"></span></label>
          <label><input type="radio" name="occasion" value="party"><span data-i18n="kiosk.occasion.party"></span></label>
          <label><input type="radio" name="occasion" value="sport"><span data-i18n="kiosk.occasion.sport"></span></label>
          <label><input type="radio" name="occasion" value="travel"><span data-i18n="kiosk.occasion.travel"></span></label>
        </div>
        <p class="hint" id="occasionHint" data-i18n="kiosk.occasion.hint"></p>
      </fieldset>
      <fieldset class="span" aria-describedby="genderErr">
        <legend data-i18n="kiosk.form.gender"></legend>
        <div class="chips two">
          <label><input type="radio" name="gender" value="male"><span data-i18n="gender.male"></span></label>
          <label><input type="radio" name="gender" value="female"><span data-i18n="gender.female"></span></label>
        </div>
        <p class="field-error" id="genderErr"></p>
      </fieldset>
      <label class="field" data-need="photo">
        <span data-i18n="kiosk.form.height"></span>
        <input name="height" inputmode="numeric" autocomplete="off" maxlength="3" data-keys="digits" data-i18n-placeholder="kiosk.form.height_ph" aria-describedby="heightErr">
        <span class="field-error" id="heightErr"></span>
      </label>
      <label class="field" data-need="photo">
        <span><span data-i18n="kiosk.form.weight"></span> <span class="hint" data-i18n="kiosk.form.optional"></span></span>
        <input name="weight" inputmode="numeric" autocomplete="off" maxlength="3" data-keys="digits" aria-describedby="weightHint weightErr">
        <span class="hint" id="weightHint" data-i18n="kiosk.form.weight_hint"></span>
        <span class="field-error" id="weightErr"></span>
      </label>
      <fieldset class="span" data-need="shoes">
        <legend><span data-i18n="kiosk.form.shoes"></span> <span class="hint" data-i18n="kiosk.form.optional"></span></legend>
        <div class="chips sizes-chips" id="shoeChips">
          <label class="wide-chip"><input type="radio" name="shoes" value="" checked><span data-i18n="kiosk.form.shoes_unknown"></span></label>
        </div>
      </fieldset>
      <div class="field span">
        <label for="budget"><span data-i18n="kiosk.form.budget"></span> <span class="hint" data-i18n="kiosk.form.optional"></span></label>
        <input id="budget" name="budget" inputmode="numeric" autocomplete="off" maxlength="11" data-keys="digits" data-i18n-placeholder="kiosk.form.budget_ph" aria-describedby="budgetErr">
        <div class="quick" role="group" data-i18n-aria-label="kiosk.form.budget_quick" id="budgetQuick"></div>
        <span class="field-error" id="budgetErr"></span>
      </div>
      <button class="primary wide go span" id="formNext"><span data-i18n="kiosk.form.next"></span><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#arrow-right"></use></svg></button>
    </form>
  </section>

  <section data-screen="camera" hidden class="camera-screen" data-mode="photo">
    <div class="frame" id="frame" data-way="photo">
      <video id="video" playsinline muted hidden></video>
      <svg class="pose" viewBox="0 0 120 240" role="img" data-i18n-aria-label="kiosk.camera.guide"><use href="/shared/icons.svg#pose"></use></svg>
      <!-- Task 29: live framing hint, the parts of the body the camera sees light up -->
      <svg class="parts" id="parts" viewBox="0 0 24 48" aria-hidden="true" hidden>
        <circle data-part="eyes" cx="12" cy="5" r="4"></circle>
        <rect data-part="shoulders" x="5" y="11" width="14" height="10" rx="3"></rect>
        <rect data-part="hips" x="6" y="22" width="12" height="6" rx="2"></rect>
        <path data-part="feet" d="M9 30v15M15 30v15"></path>
      </svg>
      <p class="framing" id="framing" aria-live="polite" hidden></p>
      <div class="count" id="count" aria-live="assertive"></div>
    </div>
    <div class="camera-copy">
      <h1 tabindex="-1" data-i18n="kiosk.camera.title"></h1>
      <fieldset class="ways">
        <legend class="visually-hidden" data-i18n="kiosk.size.ways"></legend>
        <div class="chips three">
          <label><input type="radio" name="way" value="photo" checked><span data-i18n="kiosk.size.way_photo"></span></label>
          <label><input type="radio" name="way" value="usual"><span data-i18n="kiosk.size.way_usual"></span></label>
          <label><input type="radio" name="way" value="tape"><span data-i18n="kiosk.size.way_tape"></span></label>
        </div>
      </fieldset>
      <div data-way="photo">
        <p data-i18n="kiosk.camera.intro"></p>
        <ul class="tips">
          <li><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#user"></use></svg><span data-i18n="kiosk.camera.tip_full"></span></li>
          <li><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#ruler"></use></svg><span data-i18n="kiosk.camera.tip_arms"></span></li>
          <li><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#check"></use></svg><span data-i18n="kiosk.camera.tip_feet"></span></li>
        </ul>
        <p class="notice" id="cameraStatus" role="status" hidden></p>
        <div id="partial" hidden></div>
        <div class="stack-actions">
          <button class="primary go" id="shoot"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#camera"></use></svg><span id="shootLabel" data-i18n="kiosk.camera.shoot"></span></button>
          <button id="galleryBtn" hidden><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#image"></use></svg><span data-i18n="kiosk.camera.gallery"></span></button>
          <button class="ghost" id="noPhoto" data-i18n="kiosk.camera.skip"></button>
        </div>
        <input type="file" id="gallery" accept="image/*" hidden>
        <p class="meta privacy" data-i18n="kiosk.camera.privacy"></p>
      </div>
      <!-- Task 29: a size without a photo, from the usual size or a tape measure -->
      <form id="wayForm" class="way-form" data-way="usual tape" novalidate hidden>
        <fieldset data-way="usual" data-need="top">
          <legend data-i18n="kiosk.size.usual_top"></legend>
          <div class="chips sizes-chips" id="usualTopChips"></div>
        </fieldset>
        <fieldset data-way="usual" data-need="bottom">
          <legend data-i18n="kiosk.size.jeans"></legend>
          <div class="chips sizes-chips" id="jeansChips"></div>
        </fieldset>
        <p class="muted" data-way="tape" data-i18n="kiosk.size.tape_intro"></p>
        <div class="tape-grid" data-way="tape">
          <label class="field" data-need="top"><span data-i18n="kiosk.size.chest"></span><input name="chest" inputmode="numeric" autocomplete="off" maxlength="3" data-keys="digits" data-i18n-placeholder="kiosk.size.cm_ph"></label>
          <label class="field" data-need="bottom"><span data-i18n="kiosk.size.waist"></span><input name="tapeWaist" inputmode="numeric" autocomplete="off" maxlength="3" data-keys="digits" data-i18n-placeholder="kiosk.size.cm_ph"></label>
          <label class="field" data-need="bottom"><span data-i18n="kiosk.size.hips"></span><input name="hips" inputmode="numeric" autocomplete="off" maxlength="3" data-keys="digits" data-i18n-placeholder="kiosk.size.cm_ph"></label>
        </div>
        <fieldset>
          <legend data-i18n="kiosk.size.fit"></legend>
          <div class="chips three">
            <label><input type="radio" name="fit" value="tight"><span data-i18n="kiosk.size.fit_tight"></span></label>
            <label><input type="radio" name="fit" value="regular" checked><span data-i18n="kiosk.size.fit_regular"></span></label>
            <label><input type="radio" name="fit" value="loose"><span data-i18n="kiosk.size.fit_loose"></span></label>
          </div>
        </fieldset>
        <p class="field-error" id="wayErr" role="alert"></p>
        <button class="primary wide go" id="wayNext"><span data-i18n="kiosk.size.way_next"></span><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#arrow-right"></use></svg></button>
      </form>
    </div>
  </section>

  <section data-screen="results" hidden>
    <div class="results-head">
      <div>
        <h1 tabindex="-1" data-i18n="kiosk.results.title"></h1>
        <p class="muted" id="resultsWeather"></p>
      </div>
      <div class="sizes" id="sizeBar"></div>
    </div>
    <p class="visually-hidden" id="resultsStatus" role="status"></p>
    <div id="results"></div>
    <div class="row">
      <button class="ghost" id="changeSizes"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#edit"></use></svg><span data-i18n="kiosk.results.change"></span></button>
    </div>
  </section>

  <section data-screen="mall" hidden class="mall">
    <div class="mall-head">
      <img id="mallLogo" class="mall-logo" alt="" hidden>
      <div>
        <h1 tabindex="-1" id="mallName" data-i18n="kiosk.mall.title"></h1>
        <p class="meta" id="mallWhere"></p>
      </div>
    </div>
    <form id="mallSearch" class="mall-search card" role="search" novalidate>
      <label for="mallQ" data-i18n="kiosk.mall.search_label"></label>
      <div class="mall-search-row">
        <input id="mallQ" name="q" type="search" maxlength="60" autocomplete="off" enterkeyhint="search" data-i18n-placeholder="kiosk.mall.search_ph">
        <button class="primary" type="submit"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#search"></use></svg><span data-i18n="kiosk.mall.search_go"></span></button>
      </div>
    </form>
    <p class="meta" id="mallStatus" role="status"></p>
    <div class="catalog-grid" id="mallResults"></div>
    <h2 id="mallShopsTitle"></h2>
    <ul class="store-list" id="mallShops" aria-labelledby="mallShopsTitle"></ul>
  </section>

  <section data-screen="catalog" hidden>
    <h1 tabindex="-1" data-i18n="kiosk.catalog.title"></h1>
    <div class="filters card" id="catalogFilters"></div>
    <p class="meta" id="catalogStatus" role="status"></p>
    <div class="catalog-grid" id="catalogGrid"></div>
  </section>

  <section data-screen="item" hidden>
    <h1 tabindex="-1" id="itemName"></h1>
    <div id="itemBody"></div>
  </section>

  <section data-screen="cart" hidden>
    <h1 tabindex="-1" data-i18n="kiosk.cart"></h1>
    <div class="cart-layout">
      <div>
        <p class="notice" id="holdNote" hidden></p>
        <p class="error" id="cartError" role="alert"></p>
        <div id="cartBody"></div>
        <button class="secondary wide" id="handoffBtn" hidden><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#qr"></use></svg><span data-i18n="kiosk.handoff.btn"></span></button>
        <button class="ghost" id="cartBack"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#arrow-left"></use></svg><span data-i18n="kiosk.cart.back"></span></button>
      </div>
      <form id="checkout" novalidate hidden class="card checkout">
        <fieldset>
          <legend data-i18n="kiosk.checkout.how"></legend>
          <div class="chips two">
            <label><input type="radio" name="fulfillment" value="pickup" checked><span data-i18n="kiosk.checkout.pickup"></span></label>
            <label><input type="radio" name="fulfillment" value="delivery"><span data-i18n="kiosk.checkout.delivery"></span></label>
          </div>
        </fieldset>
        <label class="field"><span data-i18n="kiosk.checkout.name"></span><input name="fullname" autocomplete="name" maxlength="80" data-keys="letters" aria-describedby="fullnameErr"><span class="field-error" id="fullnameErr"></span></label>
        <label class="field"><span data-i18n="kiosk.checkout.phone"></span><input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+998 90 123 45 67" maxlength="20" data-keys="phone" aria-describedby="phoneErr"><span class="field-error" id="phoneErr"></span></label>
        <div id="deliveryFields" hidden>
          <label class="field"><span data-i18n="kiosk.checkout.address"></span><input name="address" autocomplete="street-address" maxlength="200" data-keys="letters" data-i18n-placeholder="kiosk.checkout.address_ph" aria-describedby="addressErr"><span class="field-error" id="addressErr"></span></label>
          <p class="meta" id="mapHint" data-i18n="kiosk.checkout.map_hint"></p>
          <div id="map"></div>
        </div>
        <fieldset id="payFields" hidden>
          <legend data-i18n="kiosk.checkout.pay_how"></legend>
          <div class="chips" id="payChoices"></div>
        </fieldset>
        <fieldset id="termFields" hidden>
          <legend data-i18n="kiosk.inst.terms"></legend>
          <div class="chips terms" id="termChoices"></div>
          <p class="meta" data-i18n="kiosk.inst.note"></p>
        </fieldset>
        <div class="promo" id="promoBox">
          <div class="promo-row" id="promoAsk">
            <label class="field grow" for="promoInput"><span data-i18n="kiosk.promo.label"></span><input id="promoInput" name="promo" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="32" data-keys="code" aria-describedby="promoMsg"></label>
            <button type="button" id="promoApply" data-i18n="kiosk.promo.apply"></button>
          </div>
          <div class="promo-row" id="promoOn" hidden>
            <p class="grow" id="promoOnText"></p>
            <button type="button" class="ghost danger" id="promoRemove" data-i18n="kiosk.promo.remove"></button>
          </div>
          <p class="field-error" id="promoMsg" role="alert"></p>
        </div>
        <div class="points" id="pointsBox" hidden></div>
        <div class="sum" id="cartSum"></div>
        <p class="meta" id="payNote"></p>
        <p class="error" id="checkoutError" role="alert"></p>
        <button class="primary wide go" id="placeOrder" data-i18n="kiosk.checkout.place"></button>
      </form>
    </div>
  </section>

  <section data-screen="done" hidden class="done">
    <svg class="icon done-mark" aria-hidden="true"><use href="/shared/icons.svg#check"></use></svg>
    <h1 tabindex="-1" data-i18n="kiosk.done.title"></h1>
    <div class="order-no" id="orderNo"></div>
    <div id="doneBody"></div>
    <button class="primary wide go" id="doneHome" data-i18n="kiosk.home"></button>
  </section>
</main>
<div class="cart-bar" id="cartBar" hidden>
  <div><strong id="barCount"></strong><span class="muted" id="barTotal"></span></div>
  <button class="primary" id="barGo"><span data-i18n="kiosk.bar.go"></span><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#arrow-right"></use></svg></button>
</div>
<!-- Kiosk only: staff exit after a 3 s press on the logo (public/app/kiosk.js) -->
<dialog id="staffDlg" class="narrow" aria-labelledby="staffTitle">
  <form id="staffForm" novalidate>
    <h2 id="staffTitle" data-i18n="kiosk.staff.title"></h2>
    <p class="muted" data-i18n="kiosk.staff.text"></p>
    <label class="field"><span data-i18n="kiosk.staff.pin"></span>
      <input name="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" data-keys="digits" aria-describedby="staffErr">
      <span class="field-error" id="staffErr" role="alert"></span>
    </label>
    <div class="dialog-actions"><button type="button" id="staffCancel" data-i18n="common.cancel"></button><button class="primary" id="staffGo" data-i18n="kiosk.staff.exit"></button></div>
  </form>
</dialog>
<script type="module" src="/app/app.js"></script>
</body>
</html>
