<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Fit — Admin</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/shared/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/shared/fonts/onest-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/shared/ui.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="ui-compact">
<a class="skip" href="#main" data-i18n="adm.skip"></a>
<form id="login" class="card raised" hidden>
  <div class="wordmark"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#logo"></use></svg>Smart Fit</div>
  <h1 data-i18n="adm.login.title"></h1>
  <div id="loginLang"></div>
  <label><span data-i18n="adm.login.email"></span> <input name="email" type="email" autocomplete="username" required></label>
  <label><span data-i18n="adm.login.password"></span> <input name="password" type="password" autocomplete="current-password" required></label>
  <p class="error" id="loginError" role="alert"></p>
  <button class="primary" data-i18n="adm.login.submit"></button>
</form>

<form id="invite" class="card raised" hidden>
  <div class="wordmark"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#logo"></use></svg>Smart Fit</div>
  <h1 data-i18n="adm.inv.title"></h1>
  <p class="muted" id="inviteFor"></p>
  <input name="username" type="email" autocomplete="username" hidden>
  <div id="inviteFields">
    <label class="field"><span data-i18n="adm.pw.new"></span> <input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="200"><span class="hint" data-i18n="adm.pw.rule"></span></label>
    <label class="field"><span data-i18n="adm.pw.repeat"></span> <input name="repeat" type="password" autocomplete="new-password" required minlength="8" maxlength="200"></label>
  </div>
  <p class="error" id="inviteError" role="alert"></p>
  <button class="primary" id="inviteSubmit" data-i18n="adm.inv.submit"></button>
  <a class="button ghost" href="/admin/" id="inviteLogin" hidden data-i18n="adm.inv.to_login"></a>
</form>

<div id="app" class="shell" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="side-inner" id="sideInner">
      <a class="wordmark" href="#/dashboard"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#logo"></use></svg>Smart Fit</a>
      <label class="scope" id="scopeWrap"><span data-i18n="common.store"></span> <select id="scope"></select></label>
      <p class="scope-name" id="scopeName"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#store"></use></svg><span></span></p>
      <nav data-i18n-aria-label="adm.nav">
        <ul class="nav" id="nav">
          <li><a href="#/dashboard" data-route="dashboard"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#home"></use></svg><span data-i18n="adm.route.dashboard"></span></a></li>
          <li><a href="#/orders" data-route="orders"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#receipt"></use></svg><span data-i18n="adm.route.orders"></span><span class="nav-badge" id="ordersBadge" hidden></span></a></li>
          <li><a href="#/cashier" data-route="cashier"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#cash"></use></svg><span data-i18n="adm.route.cashier"></span></a></li>
          <li><a href="#/products" data-route="products"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#hanger"></use></svg><span data-i18n="adm.route.products"></span></a></li>
          <li><a href="#/stats" data-route="stats"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#chart"></use></svg><span data-i18n="adm.route.stats"></span></a></li>
          <li><a href="#/qr" data-route="qr"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#qr"></use></svg><span data-i18n="adm.route.qr"></span></a></li>
          <li class="nav-sep"><a href="#/settings" data-route="settings"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#settings"></use></svg><span data-i18n="adm.route.settings"></span></a></li>
        </ul>
      </nav>
      <div class="side-foot">
        <button type="button" class="user-btn" id="userBtn" popovertarget="userMenu" aria-haspopup="menu">
          <span class="avatar" id="avatar" aria-hidden="true"></span>
          <span class="user-text"><strong id="userEmail"></strong><span id="userRole"></span></span>
          <svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#chevron-down"></use></svg>
        </button>
      </div>
    </div>
  </aside>
  <div id="userMenu" class="menu" popover>
    <p class="menu-label" data-i18n="common.lang"></p>
    <div id="menuLang"></div>
    <hr>
    <a class="menu-item" href="#/settings"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#settings"></use></svg><span data-i18n="adm.route.settings"></span></a>
    <button type="button" class="menu-item" id="logout"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#logout"></use></svg><span data-i18n="adm.logout"></span></button>
  </div>

  <div class="main-col">
    <header class="topbar">
      <button type="button" class="icon-btn ghost" id="menuBtn" data-i18n-aria-label="adm.menu" data-i18n-title="adm.menu"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#menu"></use></svg></button>
      <h1 id="pageTitle"></h1>
      <span class="spacer"></span>
      <div class="top-actions" id="topActions"></div>
    </header>
    <main id="main" tabindex="-1">
      <!-- Dashboard -->
      <section data-page="dashboard" hidden>
        <div class="page-head">
          <p class="muted" id="dashDate"></p>
          <div class="seg" role="group" data-i18n-aria-label="adm.stats.period" id="dashDays"></div>
        </div>
        <div id="dashError"></div>
        <div class="kpis" id="kpis"></div>
        <div class="dash-grid">
          <section class="card panel span-2" aria-labelledby="dashChartTitle">
            <div class="panel-head">
              <div><h2 id="dashChartTitle"></h2><p class="panel-sub" id="dashChartSub"></p></div>
              <div class="seg" role="group" data-i18n-aria-label="adm.dash.metric" id="dashMetric"></div>
            </div>
            <div class="chart-box" id="dashChart"></div>
          </section>
          <section class="card panel" aria-labelledby="dashFunnelTitle">
            <div class="panel-head"><div><h2 id="dashFunnelTitle" data-i18n="adm.stats.pilot"></h2><p class="panel-sub" id="dashFunnelSub"></p></div></div>
            <div class="funnel" id="dashFunnel"></div>
          </section>
          <section class="card panel" aria-labelledby="dashTopTitle">
            <div class="panel-head"><div><h2 id="dashTopTitle" data-i18n="adm.dash.top"></h2><p class="panel-sub" id="dashTopSub"></p></div></div>
            <ol class="rank" id="dashTop"></ol>
          </section>
          <section class="card panel span-2" aria-labelledby="dashLowTitle">
            <div class="panel-head">
              <div><h2 id="dashLowTitle" data-i18n="adm.dash.low"></h2><p class="panel-sub" id="dashLowSub"></p></div>
              <a class="button ghost" href="#/products?filter=low" id="dashLowAll"><span data-i18n="adm.dash.low_all"></span><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#chevron-right"></use></svg></a>
            </div>
            <ul class="low-list" id="dashLow"></ul>
          </section>
          <section class="card panel span-2" aria-labelledby="dashKioskTitle">
            <div class="panel-head"><div><h2 id="dashKioskTitle" data-i18n="adm.dash.kiosks"></h2><p class="panel-sub" data-i18n="adm.dash.kiosks_sub"></p></div></div>
            <ul class="low-list" id="dashKiosks"></ul>
          </section>
        </div>
      </section>

      <!-- Orders -->
      <section data-page="orders" hidden>
        <section id="fitting" class="card fitting" hidden aria-labelledby="fittingTitle">
          <h2 id="fittingTitle"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#hanger"></use></svg><span data-i18n="adm.fit.title"></span></h2>
          <ul id="fittingList"></ul>
        </section>
        <div class="tabs-row" role="group" data-i18n-aria-label="adm.orders.status" id="ordersTabs"></div>
        <form class="toolbar" id="ordersFilters" role="search">
          <label class="grow"><span data-i18n="adm.orders.search"></span> <input name="q" type="search" autocomplete="off" data-i18n-placeholder="adm.orders.search_ph"></label>
          <label><span data-i18n="adm.orders.from"></span> <input name="from" type="date"></label>
          <label><span data-i18n="adm.orders.to"></span> <input name="to" type="date"></label>
        </form>
        <div id="ordersError"></div>
        <div class="table-wrap">
          <table class="table orders-table">
            <caption class="visually-hidden" data-i18n="adm.route.orders"></caption>
            <thead><tr><th>№</th><th class="hide-sm" data-i18n="adm.orders.time"></th><th data-i18n="adm.orders.customer"></th><th class="hide-sm" data-i18n="adm.orders.fulfillment"></th><th class="num" data-i18n="adm.orders.total"></th><th class="hide-sm" data-i18n="adm.orders.payment"></th><th data-i18n="adm.orders.status"></th></tr></thead>
            <tbody id="orderRows"></tbody>
          </table>
        </div>
        <nav class="pager" id="ordersPager" data-i18n-aria-label="adm.pager"></nav>
      </section>

      <!-- Cashier -->
      <section data-page="cashier" hidden>
        <div class="cashier">
          <div class="cashier-list">
            <form class="toolbar" id="payFind" role="search">
              <label class="grow"><span data-i18n="adm.paydlg.no"></span> <input name="no" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="9" autocomplete="off" required></label>
              <button class="primary"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#search"></use></svg><span data-i18n="adm.paydlg.find"></span></button>
            </form>
            <p class="error" id="payFindError" role="alert"></p>
            <h2 class="section-title"><span data-i18n="adm.cash.pending"></span> <span class="badge" id="pendingCount"></span></h2>
            <div id="cashError"></div>
            <ul class="pending" id="pendingList"></ul>
          </div>
          <section class="card cashier-panel" id="payPanel" aria-live="polite"></section>
        </div>
      </section>

      <!-- Products -->
      <section data-page="products" hidden>
        <div class="tabs-row" role="group" data-i18n-aria-label="adm.products.filter" id="productTabs"></div>
        <form class="toolbar" id="productFilters" role="search">
          <label class="grow"><span data-i18n="adm.products.search"></span> <input name="q" type="search" autocomplete="off" data-i18n-placeholder="adm.products.search_ph"></label>
          <label><span data-i18n="adm.products.category"></span> <select name="category"><option value="" data-i18n="common.all"></option></select></label>
        </form>
        <div id="listError"></div>
        <div class="table-wrap">
          <table class="table products-table">
            <caption class="visually-hidden" data-i18n="adm.route.products"></caption>
            <thead><tr id="productHead"></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <nav class="pager" id="productsPager" data-i18n-aria-label="adm.pager"></nav>
      </section>

      <!-- Stats -->
      <section data-page="stats" hidden>
        <div class="page-head">
          <p class="muted" id="statsRange"></p>
          <div class="seg" role="group" data-i18n-aria-label="adm.stats.period" id="statsDays"></div>
        </div>
        <div id="statsError"></div>
        <div class="kpis six" id="statsKpis"></div>
        <div class="dash-grid">
          <section class="card panel span-2" aria-labelledby="statsChartTitle">
            <div class="panel-head">
              <div><h2 id="statsChartTitle"></h2><p class="panel-sub" id="statsChartSub"></p></div>
              <div class="seg" role="group" data-i18n-aria-label="adm.dash.metric" id="statsMetric"></div>
            </div>
            <div class="chart-box" id="statsChart"></div>
            <details class="table-view">
              <summary data-i18n="adm.stats.table"></summary>
              <div class="table-wrap"><table class="table"><thead><tr><th data-i18n="adm.stats.day"></th><th class="num" data-i18n="adm.stats.count"></th><th class="num" data-i18n="adm.dash.paid"></th><th class="num" data-i18n="adm.dash.revenue"></th></tr></thead><tbody id="dayRows"></tbody></table></div>
            </details>
          </section>
          <section class="card panel" aria-labelledby="statsFunnelTitle">
            <div class="panel-head"><div><h2 id="statsFunnelTitle" data-i18n="adm.stats.pilot"></h2><p class="panel-sub" id="statsFunnelSub"></p></div></div>
            <div class="funnel" id="statsFunnel"></div>
          </section>
          <section class="card panel" aria-labelledby="statsTopTitle">
            <div class="panel-head"><div><h2 id="statsTopTitle" data-i18n="adm.stats.top"></h2></div></div>
            <ol class="rank" id="topRows"></ol>
          </section>
        </div>
      </section>

      <!-- QR -->
      <section data-page="qr" hidden>
        <p class="muted lead" data-i18n="adm.qrdlg.text"></p>
        <div id="qrError"></div>
        <div class="qr-grid" id="qrGrid"></div>
      </section>

      <!-- Settings: store profile, team, audit log, my account (#/settings?tab=…) -->
      <section data-page="settings" hidden>
        <nav class="tabs-row" id="setTabs" data-i18n-aria-label="adm.set.sections"></nav>

        <section data-tab="store" hidden>
          <form class="card settings-card" id="storeForm" aria-labelledby="storeTitle">
            <div class="panel-head">
              <div><h2 id="storeTitle" data-i18n="adm.set.store"></h2><p class="panel-sub" data-i18n="adm.set.store_sub"></p></div>
              <label id="storePickWrap"><span data-i18n="common.store"></span> <select id="storePick"></select></label>
            </div>
            <div id="storeLoadError"></div>
            <p class="notice" id="storeReadOnly" hidden><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#info"></use></svg><span data-i18n="adm.set.read_only"></span></p>
            <fieldset id="storeFields">
              <legend class="visually-hidden" data-i18n="adm.set.store"></legend>
              <div class="form-grid">
                <label class="field"><span data-i18n="field.name"></span> <input name="name" required maxlength="120"></label>
                <label class="field"><span data-i18n="field.city"></span> <input name="city" required maxlength="80"></label>
                <label class="field span-all"><span data-i18n="field.address"></span> <input name="address" required maxlength="200"></label>
                <label class="field"><span data-i18n="adm.set.lat"></span> <input name="lat" type="number" step="any" min="-90" max="90" required inputmode="decimal"></label>
                <label class="field"><span data-i18n="adm.set.lon"></span> <input name="lon" type="number" step="any" min="-180" max="180" required inputmode="decimal"></label>
                <p class="hint span-all map-hint"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#map-pin"></use></svg><span data-i18n="adm.set.pin_hint"></span> <a id="mapLink" target="_blank" rel="noopener noreferrer" data-i18n="adm.set.map_open"></a></p>
                <label class="field"><span data-i18n="adm.set.opens"></span> <input name="opens_at" type="time"></label>
                <label class="field"><span data-i18n="adm.set.closes"></span> <input name="closes_at" type="time"></label>
                <label class="field"><span data-i18n="field.delivery_fee"></span> <input name="delivery_fee" type="number" min="0" step="1" required inputmode="numeric"></label>
                <label class="field"><span data-i18n="field.free_threshold"></span> <input name="free_delivery_threshold" type="number" min="1" step="1" inputmode="numeric"><span class="hint" data-i18n="adm.set.free_hint"></span></label>
                <label class="field span-all"><span data-i18n="field.telegram_chat"></span> <input name="telegram_chat_id" inputmode="numeric" pattern="-?[0-9]{1,15}" maxlength="16" autocomplete="off"><span class="hint" data-i18n="adm.set.chat_hint"></span></label>
                <label class="field"><span data-i18n="field.low_stock"></span> <input name="low_stock_threshold" type="number" min="0" max="1000" step="1" required inputmode="numeric"><span class="hint" data-i18n="adm.set.low_hint"></span></label>
                <label class="field"><span data-i18n="field.kiosk_pin"></span> <input name="kiosk_pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" autocomplete="new-password" aria-describedby="pinState"><span class="hint"><strong id="pinState"></strong> <span data-i18n="adm.set.kiosk_pin_hint"></span></span></label>
              </div>
            </fieldset>
            <p class="error" id="storeError" role="alert"></p>
            <div class="actions"><button class="primary" id="storeSave" data-i18n="adm.set.save"></button></div>
          </form>
        </section>

        <section data-tab="team" hidden>
          <div class="page-head">
            <p class="muted" data-i18n="adm.team.sub"></p>
            <button type="button" class="primary" id="inviteBtn"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#plus"></use></svg><span data-i18n="adm.team.invite"></span></button>
          </div>
          <div id="teamError"></div>
          <div class="table-wrap">
            <table class="table team-table">
              <caption class="visually-hidden" data-i18n="adm.set.team"></caption>
              <thead><tr><th data-i18n="field.email"></th><th class="hide-sm" data-i18n="field.role"></th><th class="hide-sm" id="teamStoreCol" data-i18n="common.store"></th><th data-i18n="adm.team.status"></th><th><span class="visually-hidden" data-i18n="adm.team.actions"></span></th></tr></thead>
              <tbody id="teamRows"></tbody>
            </table>
          </div>
          <h2 class="section-title" data-i18n="adm.team.invites"></h2>
          <ul class="invite-list" id="inviteList"></ul>
        </section>

        <section data-tab="sync" hidden>
          <div class="page-head">
            <p class="muted" data-i18n="adm.sync.sub"></p>
            <button type="button" class="primary" id="keyBtn"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#plus"></use></svg><span data-i18n="adm.sync.create"></span></button>
          </div>
          <div id="keyError"></div>
          <ul class="invite-list" id="keyList"></ul>
          <h2 class="section-title" data-i18n="adm.sync.how"></h2>
          <p class="muted" data-i18n="adm.sync.how_text"></p>
          <pre class="card code-sample"><code id="keySample"></code></pre>
        </section>

        <section data-tab="audit" hidden>
          <form class="toolbar" id="auditFilters" role="search">
            <label><span data-i18n="adm.audit.what"></span> <select name="entity"><option value="" data-i18n="common.all"></option></select></label>
            <label class="grow"><span data-i18n="adm.audit.who"></span> <select name="admin"><option value="" data-i18n="adm.audit.everyone"></option></select></label>
            <label><span data-i18n="adm.orders.from"></span> <input name="from" type="date"></label>
            <label><span data-i18n="adm.orders.to"></span> <input name="to" type="date"></label>
          </form>
          <div id="auditError"></div>
          <div class="table-wrap">
            <table class="table audit-table">
              <caption class="visually-hidden" data-i18n="adm.set.audit"></caption>
              <thead><tr><th class="hide-sm" data-i18n="adm.orders.time"></th><th class="hide-sm" data-i18n="adm.audit.who"></th><th data-i18n="adm.audit.action"></th><th data-i18n="adm.audit.changes"></th></tr></thead>
              <tbody id="auditRows"></tbody>
            </table>
          </div>
          <nav class="pager" id="auditPager" data-i18n-aria-label="adm.pager"></nav>
        </section>

        <section data-tab="account" hidden>
          <div class="settings">
            <section class="card" aria-labelledby="accTitle">
              <h2 id="accTitle" data-i18n="adm.set.account"></h2>
              <dl class="facts" id="accFacts"></dl>
              <h3 data-i18n="common.lang"></h3>
              <div id="setLang"></div>
            </section>
            <form class="card" id="pwForm" aria-labelledby="pwTitle">
              <h2 id="pwTitle" data-i18n="adm.pw.title"></h2>
              <p class="muted" data-i18n="adm.pw.sub"></p>
              <input name="username" type="email" autocomplete="username" hidden>
              <label class="field"><span data-i18n="adm.pw.current"></span> <input name="current" type="password" autocomplete="current-password" required maxlength="200"></label>
              <label class="field"><span data-i18n="adm.pw.new"></span> <input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="200"><span class="hint" data-i18n="adm.pw.rule"></span></label>
              <label class="field"><span data-i18n="adm.pw.repeat"></span> <input name="repeat" type="password" autocomplete="new-password" required minlength="8" maxlength="200"></label>
              <p class="error" id="pwError" role="alert"></p>
              <div class="actions"><button class="primary" data-i18n="adm.pw.submit"></button></div>
            </form>
          </div>
        </section>
      </section>
    </main>
  </div>
</div>

<dialog id="navDrawer" class="drawer left" data-i18n-aria-label="adm.nav"></dialog>

<dialog id="orderDlg" class="drawer right" aria-labelledby="orderTitle">
  <div class="drawer-head">
    <h2 id="orderTitle" tabindex="-1"></h2>
    <button type="button" class="icon-btn ghost" id="orderClose" data-i18n-aria-label="common.close" data-i18n-title="common.close"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#close"></use></svg></button>
  </div>
  <div class="drawer-body" id="orderInfo"></div>
  <p class="error" id="orderError" role="alert"></p>
  <div class="drawer-foot" id="orderActions"></div>
</dialog>

<dialog id="importDlg" aria-labelledby="importTitle">
  <form id="importForm" method="dialog">
    <h2 id="importTitle" data-i18n="adm.import.title"></h2>
    <p class="sizes" data-i18n="adm.import.help"></p>
    <p><code id="importCols"></code></p>
    <label><span data-i18n="adm.import.file"></span> <input name="file" type="file" accept=".csv,text/csv" required></label>
    <p class="error" id="importError" role="alert"></p>
    <ul id="importErrors" class="error"></ul>
    <div class="actions">
      <button type="button" id="importCancel" data-i18n="common.close"></button>
      <button class="primary" data-i18n="adm.import.submit"></button>
    </div>
  </form>
</dialog>

<dialog id="inviteDlg" class="narrow" aria-labelledby="inviteTitle">
  <form id="inviteForm" method="dialog">
    <h2 id="inviteTitle" data-i18n="adm.team.invite"></h2>
    <div id="inviteAsk">
      <p class="muted" data-i18n="adm.team.invite_text"></p>
      <label class="field"><span data-i18n="field.email"></span> <input name="email" type="email" required maxlength="200" autocomplete="off"></label>
      <label class="field" id="inviteRoleWrap"><span data-i18n="field.role"></span> <select name="role"><option value="manager" data-i18n="adm.role_manager"></option><option value="owner" data-i18n="adm.role_owner"></option></select></label>
      <label class="field" id="inviteStoreWrap"><span data-i18n="common.store"></span> <select name="store_id"></select></label>
    </div>
    <div id="inviteDone" hidden>
      <p data-i18n="adm.team.link_text"></p>
      <label class="field"><span data-i18n="adm.team.link"></span> <input id="inviteUrl" readonly></label>
      <p class="hint" id="inviteExpiry"></p>
    </div>
    <p class="error" id="inviteDlgError" role="alert"></p>
    <div class="actions">
      <button type="button" id="inviteCancel" data-i18n="common.cancel"></button>
      <button class="primary" id="inviteCreate" data-i18n="adm.team.create_link"></button>
      <button type="button" class="primary" id="inviteCopy" hidden><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#check"></use></svg><span data-i18n="adm.qr.copy"></span></button>
    </div>
  </form>
</dialog>

<dialog id="keyDlg" class="narrow" aria-labelledby="keyTitle">
  <form id="keyForm" method="dialog">
    <h2 id="keyTitle" data-i18n="adm.sync.create"></h2>
    <div id="keyAsk">
      <label class="field"><span data-i18n="field.key_name"></span> <input name="name" required maxlength="60" autocomplete="off"><span class="hint" data-i18n="adm.sync.name_hint"></span></label>
      <label class="field" id="keyStoreWrap"><span data-i18n="common.store"></span> <select name="store_id"></select></label>
    </div>
    <div id="keyDone" hidden>
      <p data-i18n="adm.sync.key_text"></p>
      <label class="field"><span data-i18n="adm.sync.key"></span> <input id="keyValue" readonly spellcheck="false"></label>
    </div>
    <p class="error" id="keyDlgError" role="alert"></p>
    <div class="actions">
      <button type="button" id="keyCancel" data-i18n="common.cancel"></button>
      <button class="primary" id="keyCreate" data-i18n="adm.sync.create"></button>
      <button type="button" class="primary" id="keyCopy" hidden><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#check"></use></svg><span data-i18n="adm.qr.copy"></span></button>
    </div>
  </form>
</dialog>

<dialog id="dlg" aria-labelledby="formTitle">
  <form id="form" method="dialog">
    <h2 id="formTitle"></h2>
    <div class="grid">
      <label><span data-i18n="field.name"></span> <input name="name" required maxlength="120"></label>
      <label><span data-i18n="adm.form.name_ru"></span> <input name="name_ru" lang="ru" maxlength="120"></label>
      <label><span data-i18n="adm.products.category"></span> <select name="category" required></select></label>
      <label><span data-i18n="adm.form.gender"></span> <select name="gender" required>
        <option value="unisex" data-i18n="gender.unisex"></option><option value="male" data-i18n="gender.male"></option><option value="female" data-i18n="gender.female"></option>
      </select></label>
      <label><span data-i18n="adm.form.color"></span> <input name="color" required maxlength="40"></label>
      <label><span data-i18n="adm.form.style"></span> <input name="style" maxlength="40"></label>
      <label><span data-i18n="adm.products.price"></span> <input name="price" type="number" min="1" step="1" required></label>
      <label><span data-i18n="adm.form.discount"></span> <input name="discount_price" type="number" min="1" step="1"></label>
      <label><span data-i18n="adm.form.temp_min"></span> <input name="temp_min" type="number" step="1" required></label>
      <label><span data-i18n="adm.form.temp_max"></span> <input name="temp_max" type="number" step="1" required></label>
      <label><span data-i18n="adm.form.shelf"></span> <input name="shelf_location" maxlength="40"></label>
      <label><span data-i18n="field.sku"></span> <input name="sku" maxlength="40" pattern="[A-Za-z0-9][A-Za-z0-9._\-\/]{0,39}" autocomplete="off" spellcheck="false"></label>
      <label><span data-i18n="field.barcode"></span> <input name="barcode" maxlength="40" pattern="[A-Za-z0-9][A-Za-z0-9._\-\/]{0,39}" autocomplete="off" spellcheck="false" inputmode="numeric"></label>
      <label id="storeWrap"><span data-i18n="common.store"></span> <select name="store_id"></select></label>
      <label class="check"><input name="waterproof" type="checkbox"> <span data-i18n="adm.form.waterproof"></span></label>
    </div>
    <div id="imgWrap">
      <h3 data-i18n="adm.form.image"></h3>
      <img id="imgPreview" alt="" hidden>
      <div class="bar">
        <label class="grow"><span data-i18n="adm.form.image_hint"></span> <input id="imgFile" type="file" accept="image/jpeg,image/png,image/webp"></label>
        <button type="button" id="imgUpload"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#upload"></use></svg><span data-i18n="adm.form.image_upload"></span></button>
        <button type="button" class="danger" id="imgRemove"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#trash"></use></svg><span data-i18n="adm.form.image_remove"></span></button>
      </div>
      <p class="error" id="imgError" role="alert"></p>
    </div>
    <h3 data-i18n="adm.form.sizes"></h3>
    <div class="stock" id="stock"></div>
    <p class="error" id="formError" role="alert"></p>
    <div class="actions">
      <button type="button" class="danger ghost push-left" id="formDelete"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#trash"></use></svg><span data-i18n="common.delete"></span></button>
      <button type="button" id="cancel" data-i18n="common.cancel"></button>
      <button class="primary" id="save" data-i18n="adm.form.save"></button>
    </div>
  </form>
</dialog>

<script type="module" src="/admin/admin.js"></script>
</body>
</html>
