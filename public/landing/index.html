<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Fit</title>
<meta name="description" content="Smart Fit — savdo markazlari va kiyim do'konlari uchun kiosk va telefon ilovasi: ob-havoga mos obrazlar faqat javonda bor kiyimlardan.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/shared/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/shared/fonts/onest-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/shared/fonts/cormorant-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/shared/ui.css">
<link rel="stylesheet" href="/landing/landing.css">
<script type="module" src="/landing/landing.js"></script>
</head>
<body class="landing">
<a class="skip" href="#main" data-i18n="land.skip"></a>
<header class="bar wrap">
  <a class="wordmark" href="/"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#logo"></use></svg>Smart Fit</a>
  <nav class="bar-links" data-i18n-aria-label="land.nav">
    <a href="#mall" data-i18n="land.nav.mall"></a>
    <a href="#shop" data-i18n="land.nav.shop"></a>
    <a href="#plans" data-i18n="land.nav.plans"></a>
    <a href="#demo" data-i18n="land.nav.demo"></a>
  </nav>
  <div class="bar-end">
    <div id="lang"></div>
    <a class="signin" href="/admin/" data-i18n="land.signin"></a>
  </div>
</header>

<main id="main" tabindex="-1">
  <!-- Hero: the kiosk's own outfit card, answering the temperature the visitor picks -->
  <section class="hero wrap" aria-labelledby="heroTitle">
    <div class="hero-text">
      <h1 id="heroTitle" data-i18n="land.hero.title"></h1>
      <p class="lead" data-i18n="land.hero.lead"></p>
      <div class="hero-actions">
        <a class="button primary big" href="#demo" data-i18n="land.cta"></a>
      </div>
      <ul class="doors">
        <li><a href="#mall"><span data-i18n="land.door.mall"></span><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#chevron-down"></use></svg></a></li>
        <li><a href="#shop"><span data-i18n="land.door.shop"></span><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#chevron-down"></use></svg></a></li>
      </ul>
    </div>
    <div class="stage">
      <article class="look" data-ui aria-labelledby="lookTitle">
        <div class="look-weather">
          <span class="look-place"><svg class="icon" aria-hidden="true" id="lookIcon"><use href="/shared/icons.svg#cloud-sun"></use></svg><span data-i18n="land.look.where"></span></span>
          <div class="temps" role="radiogroup" data-i18n-aria-label="land.look.temp" id="temps"></div>
        </div>
        <div class="look-photos" id="lookPhotos" aria-hidden="true"></div>
        <div class="look-body">
          <h2 class="look-title" id="lookTitle" data-i18n="land.look.title"></h2>
          <ul class="look-rows" id="lookRows" aria-live="polite"></ul>
          <div class="look-total"><span data-i18n="land.look.total"></span><strong class="num" id="lookTotal"></strong></div>
          <button type="button" class="primary look-add" id="lookAdd"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#bag"></use></svg><span data-i18n="land.look.add"></span></button>
        </div>
        <noscript><img src="/landing/img/kiosk-results.jpg" width="1600" height="1000" alt=""></noscript>
      </article>
      <p class="stage-note" data-i18n="land.look.note"></p>
    </div>
  </section>

  <!-- Two buyers: the mall and the shop. Each finds its part in one read. -->
  <section class="side wrap" id="mall" aria-labelledby="mallTitle">
    <div class="side-head">
      <p class="kicker" data-i18n="land.mall.kicker"></p>
      <h2 class="section-h" id="mallTitle" data-i18n="land.mall.title"></h2>
      <p class="side-lead" data-i18n="land.mall.lead"></p>
      <div class="side-links">
        <a class="arrow-link" href="/m?mall=1"><span data-i18n="land.try_mall_phone"></span><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#arrow-right"></use></svg></a>
        <a class="arrow-link" href="/kiosk?mall=1"><span data-i18n="land.try_mall_kiosk"></span><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#arrow-right"></use></svg></a>
      </div>
      <figure class="side-shot">
        <img src="/landing/img/mall-phone.jpg" width="480" height="1037" alt="" loading="lazy">
        <figcaption data-i18n="land.mall.shot"></figcaption>
      </figure>
    </div>
    <ol class="points">
      <li><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#map-pin"></use></svg><h3 data-i18n="land.mall.dir"></h3><p data-i18n="land.mall.dir_c"></p></li>
      <li><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#bag"></use></svg><h3 data-i18n="land.mall.cart"></h3><p data-i18n="land.mall.cart_c"></p></li>
      <li><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#sparkle"></use></svg><h3 data-i18n="land.mall.offers"></h3><p data-i18n="land.mall.offers_c"></p></li>
      <li><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#chart"></use></svg><h3 data-i18n="land.mall.stats"></h3><p data-i18n="land.mall.stats_c"></p></li>
    </ol>
  </section>

  <section class="side wrap" id="shop" aria-labelledby="shopTitle">
    <div class="side-head">
      <p class="kicker" data-i18n="land.shop.kicker"></p>
      <h2 class="section-h" id="shopTitle" data-i18n="land.shop.title"></h2>
      <p class="side-lead" data-i18n="land.shop.lead"></p>
      <div class="side-links">
        <a class="arrow-link" href="/kiosk?store=1"><span data-i18n="land.try_kiosk"></span><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#arrow-right"></use></svg></a>
        <a class="arrow-link" href="/m?store=1"><span data-i18n="land.try_phone"></span><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#arrow-right"></use></svg></a>
        <a class="arrow-link" href="/staff/"><span data-i18n="land.try_staff"></span><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#arrow-right"></use></svg></a>
      </div>
    </div>
    <ol class="points">
      <li><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#ruler"></use></svg><h3 data-i18n="land.shop.fit"></h3><p data-i18n="land.shop.fit_c"></p></li>
      <li><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#hanger"></use></svg><h3 data-i18n="land.shop.catalog"></h3><p data-i18n="land.shop.catalog_c"></p></li>
      <li><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#cash"></use></svg><h3 data-i18n="land.shop.cashier"></h3><p data-i18n="land.shop.cashier_c"></p></li>
      <li><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#qr"></use></svg><h3 data-i18n="land.shop.staff"></h3><p data-i18n="land.shop.staff_c"></p></li>
      <li><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#trend-up"></use></svg><h3 data-i18n="land.shop.owner"></h3><p data-i18n="land.shop.owner_c"></p></li>
    </ol>
  </section>

  <!-- The three screens, as they are -->
  <section class="screens wrap" id="screens" aria-labelledby="screensTitle">
    <div class="screens-head">
      <h2 class="section-h" id="screensTitle" data-i18n="land.screens.title"></h2>
      <p data-i18n="land.screens.lead"></p>
    </div>
    <figure class="shot shot-kiosk">
      <img src="/landing/img/kiosk-start.jpg" width="1600" height="1000" alt="" loading="lazy">
      <figcaption><strong data-i18n="land.shot.kiosk"></strong> <span data-i18n="land.shot.kiosk_c"></span></figcaption>
    </figure>
    <figure class="shot shot-phone">
      <img src="/landing/img/phone-results.jpg" width="780" height="1688" alt="" loading="lazy">
      <figcaption><strong data-i18n="land.shot.phone"></strong> <span data-i18n="land.shot.phone_c"></span></figcaption>
    </figure>
    <figure class="shot shot-results">
      <img src="/landing/img/kiosk-results.jpg" width="1600" height="1000" alt="" loading="lazy">
      <figcaption><strong data-i18n="land.shot.results"></strong> <span data-i18n="land.shot.results_c"></span></figcaption>
    </figure>
    <figure class="shot shot-admin">
      <img src="/landing/img/admin-products.jpg" width="1600" height="1000" alt="" loading="lazy">
      <figcaption><strong data-i18n="land.shot.admin"></strong> <span data-i18n="land.shot.admin_c"></span></figcaption>
    </figure>
  </section>

  <!-- Onboarding as call and response -->
  <section class="calls wrap" id="start" aria-labelledby="startTitle">
    <div class="calls-col">
      <h2 class="section-h" id="startTitle" data-i18n="land.start.title"></h2>
      <p class="calls-lead" data-i18n="land.start.lead"></p>
      <div class="call">
        <p class="call-say" data-i18n="land.start.s1"></p>
        <div class="call-in" data-ui><span class="ui-label" data-i18n="field.address"></span><span class="ui-input" data-i18n="land.start.s1_in"></span></div>
        <div class="call-out" data-ui><p class="notice"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#check"></use></svg><span data-i18n="land.start.s1_out"></span></p></div>
      </div>
      <div class="call">
        <p class="call-say" data-i18n="land.start.s2"></p>
        <div class="call-in" data-ui><span class="ui-label" data-i18n="land.start.s2_label"></span><span class="ui-input"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#upload"></use></svg><span data-i18n="land.start.s2_in"></span></span></div>
        <div class="call-out" data-ui><p class="notice"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#check"></use></svg><span data-i18n="land.start.s2_out"></span></p></div>
      </div>
      <div class="call">
        <p class="call-say" data-i18n="land.start.s3"></p>
        <div class="call-in" data-ui><span class="ui-button"><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#print"></use></svg><span data-i18n="land.start.s3_in"></span></span></div>
      </div>
    </div>
    <div class="call-final" data-ui>
      <img class="qr" src="/landing/qr.svg" width="240" height="240" alt="" loading="lazy">
      <div class="final-text">
        <p class="final-name" data-i18n="land.start.final_name"></p>
        <p data-i18n="land.start.final_text"></p>
        <a class="arrow-link" href="/m?store=1"><span data-i18n="land.try_phone"></span><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#arrow-right"></use></svg></a>
      </div>
      <img class="final-shot" src="/landing/img/kiosk-start.jpg" width="1600" height="1000" alt="" loading="lazy">
    </div>
  </section>

  <!-- Plans: limits from src/plans.js (/landing/plans.json); no prices are set, so each asks -->
  <section class="plans wrap" id="plans" aria-labelledby="plansTitle">
    <div class="plans-head">
      <h2 class="section-h" id="plansTitle" data-i18n="land.plans.title"></h2>
      <p id="plansTrial"></p>
    </div>
    <div class="tier-list" id="planList"></div>
    <p class="plans-note" id="plansGrace"></p>
  </section>

  <!-- What it works with -->
  <section class="tiles wrap" aria-labelledby="tilesTitle">
    <div class="tile tile-head"><h2 class="section-h" id="tilesTitle" data-i18n="land.tiles.title"></h2><p data-i18n="land.tiles.lead"></p></div>
    <div class="tile"><p class="tile-name">Excel</p><p data-i18n="land.tile.excel"></p><span class="badge ok" data-i18n="land.tile.ready"></span></div>
    <div class="tile"><p class="tile-name">API</p><p data-i18n="land.tile.api"></p><span class="badge ok" data-i18n="land.tile.ready"></span></div>
    <div class="tile"><p class="tile-name">Open-Meteo</p><p data-i18n="land.tile.weather"></p><span class="badge ok" data-i18n="land.tile.ready"></span></div>
    <div class="tile"><p class="tile-name" data-i18n="land.tile.tablet_name"></p><p data-i18n="land.tile.tablet"></p><span class="badge ok" data-i18n="land.tile.ready"></span></div>
    <div class="tile"><p class="tile-name">Telegram</p><p data-i18n="land.tile.telegram"></p><span class="badge off" data-i18n="land.tile.connect"></span></div>
    <div class="tile"><p class="tile-name">Click · Payme</p><p data-i18n="land.tile.pay"></p><span class="badge off" data-i18n="land.tile.connect"></span></div>
    <div class="tile"><p class="tile-name">Claude · Gemini</p><p data-i18n="land.tile.claude"></p><span class="badge off" data-i18n="land.tile.connect"></span></div>
    <div class="tile"><p class="tile-name">FASHN</p><p data-i18n="land.tile.fashn"></p><span class="badge off" data-i18n="land.tile.connect"></span></div>
  </section>

  <!-- Demo request -->
  <section class="ask wrap" id="demo" aria-labelledby="demoTitle">
    <div class="ask-col">
      <h2 class="ask-prompt section-h" id="demoTitle" data-i18n="land.demo.q1"></h2>
      <p class="ask-lead" data-i18n="land.demo.q2"></p>
      <form id="demoForm" novalidate>
        <div class="ask-grid">
          <label class="field"><span data-i18n="land.demo.name"></span> <input name="name" required minlength="2" maxlength="80" autocomplete="name"></label>
          <label class="field"><span data-i18n="land.demo.phone"></span> <input name="phone" type="tel" required maxlength="20" autocomplete="tel" placeholder="+998 90 123 45 67" aria-describedby="phoneHint"><span class="hint" id="phoneHint" data-i18n="land.demo.phone_hint"></span></label>
          <label class="field"><span data-i18n="field.company"></span> <input name="company" required maxlength="120" autocomplete="organization"></label>
          <label class="field"><span data-i18n="field.city"></span> <input name="city" maxlength="80" autocomplete="address-level2"></label>
          <label class="field"><span data-i18n="field.stores"></span> <input name="stores" type="number" min="1" max="1000" step="1" inputmode="numeric"></label>
          <label class="field span-all"><span data-i18n="land.demo.message"></span> <textarea name="message" rows="3" maxlength="500"></textarea></label>
        </div>
        <p class="error" id="demoError" role="alert"></p>
        <p class="notice" id="demoDone" role="status" hidden><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#check"></use></svg><span data-i18n="land.demo.done"></span></p>
        <button class="primary big" id="demoSubmit"><span data-i18n="land.demo.submit"></span><svg class="icon" aria-hidden="true"><use href="/shared/icons.svg#arrow-right"></use></svg></button>
        <p class="ask-next" data-i18n="land.demo.next"></p>
      </form>
    </div>
    <dl class="ask-links">
      <div><dt data-i18n="land.demo.kiosk"></dt><dd><a href="/kiosk?store=1" data-i18n="land.try_kiosk"></a></dd></div>
      <div><dt data-i18n="land.demo.phone_demo"></dt><dd><a href="/m?store=1" data-i18n="land.try_phone"></a></dd></div>
      <div><dt data-i18n="land.demo.mall_demo"></dt><dd><a href="/m?mall=1" data-i18n="land.try_mall_phone"></a></dd></div>
      <div><dt data-i18n="land.demo.staff_demo"></dt><dd><a href="/staff/" data-i18n="land.try_staff"></a></dd></div>
      <div><dt data-i18n="land.demo.owners"></dt><dd><a href="/admin/" data-i18n="land.signin"></a></dd></div>
    </dl>
  </section>
</main>

<footer class="foot">
  <div class="foot-tile foot-say"><p data-i18n="land.foot.say"></p><p class="foot-legal">© 2026 Smart Fit</p></div>
  <nav class="foot-tile foot-nav" data-i18n-aria-label="land.nav">
    <a href="/kiosk?store=1" data-i18n="land.try_kiosk"></a>
    <a href="/m?store=1" data-i18n="land.try_phone"></a>
    <a href="/m?mall=1" data-i18n="land.try_mall_phone"></a>
    <a href="#plans" data-i18n="land.nav.plans"></a>
    <a href="#demo" data-i18n="land.cta"></a>
    <a href="/admin/" data-i18n="land.signin"></a>
  </nav>
  <div class="foot-tile foot-time"><p data-i18n="land.foot.city"></p><p class="foot-clock num" id="clock"></p></div>
  <div class="foot-tile foot-mark" aria-hidden="true">Smart Fit</div>
  <a class="foot-tile foot-go" href="#demo"><span data-i18n="land.cta"></span><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M10 38 38 10M16 10h22v22" fill="none" stroke="currentColor" stroke-width="4"/></svg></a>
</footer>
</body>
</html>
